version: 2

builds:
  - binary: apialerts
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    hooks:
      post:
        - cmd: >-
            {{- if eq .Os "darwin" }}
            codesign --force --options runtime --sign "Developer ID Application: Jared Hall ({{ .Env.APPLE_TEAM_ID }})" --timestamp "{{ .Path }}"
            {{- else }}
            true
            {{- end }}
          output: true

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

nfpms:
  - id: packages
    package_name: apialerts
    vendor: apialerts
    homepage: https://apialerts.com
    maintainer: API Alerts <support@apialerts.com>
    description: API Alerts CLI - send events from your terminal
    license: MIT
    formats:
      - deb
      - rpm

homebrew_casks:
  - name: apialerts
    repository:
      owner: apialerts
      name: homebrew-tap
      token: "{{ .Env.GORELEASER_TOKEN }}"
    homepage: "https://apialerts.com"
    description: "API Alerts CLI - send events from your terminal"

scoops:
  - name: apialerts
    repository:
      owner: apialerts
      name: scoop-bucket
      token: "{{ .Env.GORELEASER_TOKEN }}"
    homepage: "https://apialerts.com"
    description: "API Alerts CLI - send events from your terminal"

winget:
  - name: apialerts
    publisher: apialerts
    package_identifier: APIAlerts.CLI
    short_description: "API Alerts CLI - send events from your terminal"
    description: "A command-line interface for apialerts.com. Send events from your terminal, scripts, and CI/CD pipelines. Supports APIALERTS_API_KEY env var and machine-readable --json output for AI agents and automation."
    homepage: "https://apialerts.com"
    license: MIT
    license_url: "https://github.com/apialerts/cli/blob/main/LICENSE"
    publisher_url: "https://apialerts.com"
    publisher_support_url: "https://github.com/apialerts/cli/issues"
    tags:
      - cli
      - notifications
      - monitoring
      - observability
      - alerts
    repository:
      owner: apialerts
      name: winget-pkgs
      token: "{{ .Env.GORELEASER_TOKEN }}"
      branch: "{{ .ProjectName }}-{{ .Version }}"
      pull_request:
        enabled: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

changelog:
  sort: asc
